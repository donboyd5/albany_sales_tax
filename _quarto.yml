project:
  type: default
  output-dir: _output
  render:
    - index.qmd
    - analysis/route-b.qmd
    - analysis/city-halfpct-revenue.qmd
    - analysis/memo.qmd

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    embed-resources: true
    df-print: paged
    theme: cosmo
    fig-width: 8
    fig-height: 5

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
